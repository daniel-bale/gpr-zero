[project]
name = "gpr-zero"
version = "0.1.0"
description = "Improving Geopolitical Risk Assessment with LLM-based approaches"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.2.1",
    "fastwarc>=0.15.2",
    "ibis-framework[duckdb,polars]>=10.3.1",
    "matplotlib>=3.10.1",
    "numpy>=2.2.3",
    "openai>=1.66.3",
    "pandas>=2.2.3",
    "polars>=1.25.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "seaborn>=0.13.2",
    "selectolax>=0.3.29",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = ["pytest>=8.3.5"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
gpr = "gpr_zero.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src"]
